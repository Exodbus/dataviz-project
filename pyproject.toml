[project]
name = "so-ece-data-ia"
version = "0.1.0"
description = "App Streamlit : quelles technologies enseigner dans la majeure Data & IA de l'ECE, d'après le Stack Overflow Developer Survey 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "pandas>=2.2",
    "plotly>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so_ece"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
